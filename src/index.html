<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner - Neon Void</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Courier New', monospace;
            background: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ff88;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            z-index: 100;
            font-family: 'Courier New', monospace;
        }

        #score {
            margin-bottom: 10px;
        }

        #best {
            font-size: 18px;
            opacity: 0.8;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00ff88;
            z-index: 200;
            font-size: 32px;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        #menu h1 {
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        #menu p {
            font-size: 20px;
            opacity: 0.7;
        }

        #menu.hidden {
            display: none;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff0055;
            z-index: 200;
            font-size: 32px;
            text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            display: none;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #gameOver.show {
            display: flex;
        }

        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 150;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 10px #00ff88;
            transition: all 0.1s;
        }

        .control-btn:active {
            background: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 20px #00ff88;
        }

        @media (max-width: 768px) {
            #hud {
                font-size: 18px;
            }
            #menu h1 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="hud">
        <div id="score">SCORE: 0</div>
        <div id="best">BEST: 0</div>
    </div>

    <div id="menu">
        <h1>NEON VOID</h1>
        <p>ENDLESS RUNNER</p>
        <p style="font-size: 16px; margin-top: 20px;">PRESS SPACE TO START</p>
        <p style="font-size: 14px; opacity: 0.5; margin-top: 10px;">USE ← → TO MOVE</p>
    </div>

    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p id="finalScore">SCORE: 0</p>
        <p style="font-size: 16px; margin-top: 20px;">PRESS SPACE TO RESTART</p>
    </div>

    <div id="mobileControls">
        <button class="control-btn" id="leftBtn">◀</button>
        <button class="control-btn" id="rightBtn">▶</button>
    </div>
</body>
</html>
